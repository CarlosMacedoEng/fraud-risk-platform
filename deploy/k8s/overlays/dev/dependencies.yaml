# Dev-only, single-pod dependencies (no persistence guarantees). In AWS these are RDS, ElastiCache and MSK.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: riskplatform }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: decision-service-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: decision-service-db, key: password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, risk] }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app.kubernetes.io/name: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 300Mi }, limits: { memory: 300Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app.kubernetes.io/name: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka } }
    spec:
      enableServiceLinks: false        # a Service named "kafka" would inject KAFKA_* variables that confuse the image
      containers:
        - name: kafka
          image: apache/kafka:4.1.0          # JVM image (native image: coordinator desync, J-25)
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          ports: [{ containerPort: 9092 }]
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec: { selector: { app.kubernetes.io/name: kafka }, ports: [{ port: 9092 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: simulators }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: simulators } }
  template:
    metadata: { labels: { app.kubernetes.io/name: simulators } }
    spec:
      enableServiceLinks: false
      containers:
        - name: simulators
          image: fraud-platform-simulators:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: THREAT_FEED, value: /data/threat_feed_ips.txt }]
          volumeMounts: [{ name: threat-feed, mountPath: /data, readOnly: true }]
          ports: [{ containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8090 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 512Mi } }
      volumes: [{ name: threat-feed, configMap: { name: simulators-threat-feed } }]
---
apiVersion: v1
kind: Service
metadata: { name: simulators }
spec: { selector: { app.kubernetes.io/name: simulators }, ports: [{ port: 8090 }] }
