# External Secrets Operator: syncs the RDS credentials from AWS Secrets Manager (rotation handled there; pods pick
# up rotated values on restart - the rotation runbook includes a rolling restart, see TS-16 A).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: decision-service-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: decision-service-db, creationPolicy: Owner }
  data:
    - { secretKey: username, remoteRef: { key: fraud-prod/rds/decision-service, property: username } }
    - { secretKey: password, remoteRef: { key: fraud-prod/rds/decision-service, property: password } }
