apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/managed-by: kustomize }
resources:
  - config.yaml
  - decision-service.yaml
  - file-adapter.yaml
  - model-service.yaml
# Stateful dependencies (PostgreSQL, Redis, Kafka) are NOT in the base: in AWS they are managed services
# (RDS, ElastiCache, MSK - see docs/AWS_AND_KUBERNETES.md). The dev overlay adds single-pod versions for kind.
