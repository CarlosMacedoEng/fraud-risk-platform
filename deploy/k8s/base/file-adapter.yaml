# file-adapter: scheduled ingestion of legacy files. One replica is enough for the volume (files per day, not per
# second). Concurrent scanners are safe (each file is claimed in PostgreSQL before processing), but a single replica
# keeps the operational picture simple. The shared directory is a PVC here; on AWS the natural replacement is S3
# (event notification -> queue), which is a code change listed as a future improvement, not implemented.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-adapter
  labels: { app.kubernetes.io/name: file-adapter, app.kubernetes.io/part-of: fraud-platform }
spec:
  replicas: 1
  strategy: { type: Recreate }          # RWO volume: the old pod must release it first
  selector:
    matchLabels: { app.kubernetes.io/name: file-adapter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: file-adapter, app.kubernetes.io/part-of: fraud-platform }
    spec:
      enableServiceLinks: false   # Service "redis" would inject REDIS_PORT=tcp://... and break config binding
      terminationGracePeriodSeconds: 60   # let an in-flight file finish; unfinished files are re-claimed on restart
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: file-adapter
          image: fraud-platform/file-adapter:1.0.0
          ports: [{ name: http, containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: file-adapter-config } }]
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: decision-service-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: decision-service-db, key: password } }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - { name: files, mountPath: /files }
            - { name: tmp, mountPath: /tmp }
            - { name: dumps, mountPath: /dumps }     # image writes the GC log and heap dumps here
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - { name: files, persistentVolumeClaim: { claimName: file-adapter-files } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - { name: dumps, emptyDir: { sizeLimit: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-adapter-files
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: file-adapter
spec:
  selector: { app.kubernetes.io/name: file-adapter }
  ports: [{ name: http, port: 80, targetPort: http }]
