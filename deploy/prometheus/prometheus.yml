global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: decision-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["decision-service:8080"] }]
  - job_name: file-adapter
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["file-adapter:8081"] }]
  - job_name: simulators
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["simulators:8090"] }]
